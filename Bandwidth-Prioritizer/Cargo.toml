[workspace]
resolver = "2"
members = [
    "crates/bwp-core",
    "crates/bwp-monitor",
    "crates/bwp-controller",
    "crates/bwp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Shidori5417"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shidori5417/Bandwidth-Prioritizer"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization & Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# File watching (hot-reload)
notify = "7"

# Internal crates
bwp-core = { path = "crates/bwp-core" }
bwp-monitor = { path = "crates/bwp-monitor" }
bwp-controller = { path = "crates/bwp-controller" }

# Windows API
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_results = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cargo = { level = "warn", priority = -1 }
