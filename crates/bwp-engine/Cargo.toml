[package]
name = "bwp-engine"
description = "Core state machine and orchestration for Bandwidth-Prioritizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bwp-core = { workspace = true }
bwp-controller = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
dashmap = "5"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
bwp-monitor = { workspace = true }
tracing-subscriber = { workspace = true }
windows-service = { workspace = true }

[features]
default = []
# EXPERIMENTAL opt-in WinDivert packet shaping; also needs `[shaping] experimental_windivert
# = true` in config.toml. See the README.
experimental-windivert = ["bwp-controller/experimental-windivert"]

[lints]
workspace = true
