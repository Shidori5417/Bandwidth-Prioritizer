name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'clippy.toml'
      - 'rustfmt.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'clippy.toml'
      - 'rustfmt.toml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v7

      # The experimental-windivert feature (enabled by --all-features) links against the
      # official WinDivert SDK; fetch it, verified by checksum, on the Windows legs.
      - name: Download WinDivert SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "windivert.zip"
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15") { throw "WinDivert checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "windivert")
          $dir = Join-Path $env:RUNNER_TEMP "windivert\WinDivert-2.2.2-A\x64"
          "WINDIVERT_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Test binaries load WinDivert.dll at startup.
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check, check run oluşturmak için checks: write ister; yoksa
    # "Resource not accessible by integration" ile başarısız olur.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
